<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Urban Agent · Research Workspace</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6f7;color:#183549;font:15px/1.6 system-ui}header{padding:18px 26px;background:white;border-bottom:1px solid #cbdadd}h1{margin:0;font-size:24px}small{color:#526c78}main{display:grid;grid-template-columns:1fr 1fr;height:calc(100vh - 110px);gap:18px;padding:18px}section{background:white;border:1px solid #ccdbde;border-radius:12px;padding:18px;overflow:auto}#left{display:flex;flex-direction:column}#chat{flex:1;overflow:auto;min-height:150px}.msg{white-space:pre-wrap;padding:12px;border-bottom:1px solid #e3e9eb}.human{background:#fff2e6}.tool{font-size:12px;color:#087e87}textarea{width:100%;min-height:95px;font:inherit;padding:12px}button{background:#087e87;color:white;border:0;padding:10px 18px;border-radius:5px;cursor:pointer;margin:6px 6px 0 0}button:disabled{opacity:.4}article{border-left:4px solid #087e87;padding:12px;margin:12px 0;background:#f0f7f7}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}h2{font-size:18px;margin:0 0 10px}#workspace{overflow-wrap:anywhere}#status{font-weight:bold;color:#087e87}@media(max-width:850px){main{grid-template-columns:1fr;height:auto}#left{min-height:70vh}}</style>
<header><h1>Urban Agent <small>交互研究工作区 · Pi runtime</small></h1><span id="status">连接中…</span> · Kimi Code · 真实会话 / 真实工具执行</header>
<main><section id="left"><h2>人与 Planner 对话</h2><div id="chat"></div><form id="form"><textarea id="message" placeholder="告诉 Agent 你的研究问题、可用数据，以及希望先完成哪一步。运行期间也可发送纠正。"></textarea><button id="send" disabled>发送 / 纠正</button><button type="button" id="abort">中止当前执行</button></form></section><section><h2>Research Tree / 节点卡片</h2><small>与 Agent 共享同一份磁盘状态；不以示例内容冒充实际结果。</small><div id="tree">尚未建立研究树。请先与 Agent 确定研究问题。</div><hr><h2>独立工作区</h2><pre id="workspace"></pre><small>将输入文件放入 data/；脚本和结果分别保存在 work/、outputs/。本地服务不是操作系统级安全沙箱。当前显示回答、工具动作和研究状态，不展示隐藏推理。</small></section></main>
<script>const token='__TOKEN__';const $=id=>document.getElementById(id);let count=0;async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'x-workspace-token':token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error(await r.text());return r.json()}async function refresh(){try{const s=await api('/state');$('status').textContent=!s.alive?'运行已停止':!s.ready?'运行环境启动中':s.busy?'Agent 执行中，可发送纠正':'已就绪，等待你的研究任务';$('send').disabled=!s.ready||!s.alive;$('workspace').textContent=s.workspace;for(const e of s.events.slice(count)){const p=document.createElement('div');p.className='msg '+(e.type==='human'?'human':e.type==='answer'?'':'tool');p.textContent=e.type==='human'?'你：\n'+e.text:e.type==='answer'?'Agent：\n'+(e.text||e.error||''):e.text||[e.type,e.tool,e.isError?'FAILED':''].join(' ');$('chat').append(p)}if(s.events.length!==count)$('chat').scrollTop=$('chat').scrollHeight;count=s.events.length;if(s.tree){$('tree').replaceChildren();for(const n of Object.values(s.tree.nodes||{})){const a=document.createElement('article');const h=document.createElement('b');h.textContent=n.title||n.nodeId;const p=document.createElement('div');p.textContent=n.status+' · '+(n.summary||'');const d=document.createElement('details'),label=document.createElement('summary'),pre=document.createElement('pre');label.textContent='查看卡片 / 父节点 / 产物记录';pre.textContent=JSON.stringify(n,null,2);d.append(label,pre);a.append(h,p,d);$('tree').append(a)}}}catch(e){$('status').textContent='连接失败：'+e.message}}
$('form').onsubmit=async e=>{e.preventDefault();const message=$('message').value.trim();if(!message)return;try{await api('/message',{message});$('message').value='';await refresh()}catch(e){alert(e.message)}};$('abort').onclick=()=>api('/abort',{}).catch(e=>alert(e.message));refresh();setInterval(refresh,1500);</script></html>
